name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter and typecheck
        run: bun run typecheck

      - name: Run automated test suite
        run: bun test

      - name: Compile standalone CLI binary
        run: bun run build:cli

      - name: Verify CLI binary execution and multi-environment bundles
        run: |
          chmod +x ./bin/promptcraft
          ./bin/promptcraft capabilities
          ./bin/promptcraft photo --subject "test subject" --movie-look blade-runner-2049 --raw
          bun run build:bundle
          bun run verify:builds

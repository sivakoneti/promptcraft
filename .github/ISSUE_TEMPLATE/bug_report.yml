name: Bug report
description: Create a report to help us improve Promptcraft
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you are testing against the latest version.
  - type: input
    id: version
    attributes:
      label: Promptcraft Version / Commit
      placeholder: e.g. v1.2.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime Environment
      placeholder: e.g. Linux x86_64, macOS ARM64, Bun 1.2+, Node.js v22
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Provide command line input, JSON payload, or code snippet.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: CLI / Diagnostics Output
      description: Copy and paste the command output or diagnostics JSON if applicable.
      render: shell

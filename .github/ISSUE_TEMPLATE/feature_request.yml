name: Feature request
description: Suggest an idea or enhancement for Promptcraft (new targets, presets, dialects, optics)
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new model dialects, cinematic presets, camera movements, or compiler capabilities!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem or limitation?
      description: A clear and concise description of the problem or limitation you are facing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional context or alternative approaches
      description: Any other context, references, papers, or alternative solutions considered.
